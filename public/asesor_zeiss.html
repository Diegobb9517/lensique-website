<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cotizador de Micas ZEISS · Lensique</title>
<style>
:root{--navy:#16223f;--line:#e8eaed;--grey:#7b7b7b;--blue:#2f6bff;--green:#1a9c6b;--gold:#9a7b3b;--soft:#f6f7f8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--navy);background:#eef0f3;height:100vh;overflow:hidden}
.modal{max-width:980px;height:100vh;margin:0 auto;background:#fff;display:grid;grid-template-columns:minmax(300px,380px) 1fr}
@media(max-width:820px){
  .modal{grid-template-columns:1fr;height:auto}
  body{overflow:auto;height:auto}
  .left{padding:30px 20px!important;height:auto!important;border-right:none!important;border-bottom:1px solid var(--line)}
  .right{overflow:visible!important;height:auto!important;padding:30px 20px!important}
}
.left{border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:40px 30px;height:100%}
.left .zl{height:28px;width:auto;display:block}
.left .cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:4px}
.left h2{font-family:Georgia,serif;font-size:26px;margin:0;color:var(--navy)}
.lensimg{width:100%;max-width:300px;border-radius:16px;display:block;margin:6px 0;box-shadow:0 14px 34px rgba(22,34,63,.12);transition:opacity .25s ease,transform .25s ease}
.lensart{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#ffffff,#e9f1f6 55%,#cfe0ea);box-shadow:0 14px 34px rgba(22,34,63,.12),inset 0 2px 10px rgba(255,255,255,.7);margin:14px 0}
.pr{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:4px}
.pr .d{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.pr .v{font-size:36px;font-weight:800;letter-spacing:-.5px;color:var(--navy);transition:color .2s}
.pr .n{font-size:12.5px;color:var(--grey)}
.msi{font-size:12.5px;color:var(--green);font-weight:600;margin-top:3px}
.right{padding:44px 46px;display:flex;flex-direction:column;justify-content:safe center;height:100%;min-height:0;overflow-y:auto}
.step{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);font-weight:700;margin-bottom:8px}
h1{font-family:Georgia,serif;font-size:32px;margin:0 0 6px;color:var(--navy);line-height:1.2}
.sub{color:var(--grey);font-size:15px;margin:0 0 24px;line-height:1.45}
.back{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;color:var(--navy);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;transition:background .2s}
.back:hover{background:#eaedf1}
.opt{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:13px;cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.opt:hover{border-color:#b8c3d9}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--soft)}
.opt .ic{width:30px;height:30px;flex:none;color:var(--navy)}
.opt .t{flex:1}.opt .t b{font-size:16px;display:block}.opt .t span{display:block;color:var(--grey);font-size:13px;margin-top:2px}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #cfc9bc;flex:none;transition:all .2s}
.opt.sel .rd{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 4px #fff}
.cta{width:100%;border:none;border-radius:999px;padding:16px;font-size:16px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer;margin-top:12px;transition:background .2s,transform .2s;display:block;text-align:center;text-decoration:none}
.cta:hover{background:#0e172c;transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:36px 1fr 1fr 1fr;gap:10px;align-items:center}
.grid .lb{font-size:11px;color:var(--grey);text-align:center;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grid .rl{font-size:13px;font-weight:700;color:var(--navy)}
.grid select,.grid input{font-size:14px;padding:11px 10px;border-radius:10px;border:1px solid var(--line);width:100%;color:var(--navy);background:#fff}
/* selector controlado */
.dd{position:relative;width:100%}
.dd-btn{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;padding:11px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;user-select:none;transition:border-color .15s}
.dd-btn:hover{border-color:#b8c3d9}
.dd-btn .car{color:var(--grey);font-size:10px;transition:transform .15s}
.dd.open .dd-btn{border-color:var(--navy)}.dd.open .dd-btn .car{transform:rotate(180deg)}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:40;max-height:230px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(16,24,40,.16);padding:4px;display:none}
.dd.open .dd-list{display:block}.dd.up .dd-list{top:auto;bottom:calc(100% + 5px)}
.dd-opt{padding:9px 11px;font-size:14px;border-radius:7px;cursor:pointer;white-space:nowrap;color:var(--navy)}
.dd-opt:hover{background:var(--soft)}.dd-opt.sel{background:var(--soft);font-weight:600}
.same{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;cursor:pointer;color:var(--navy);user-select:none}
.lab{font-size:12px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 10px}
.add{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-size:14.5px;transition:border-color .2s,box-shadow .2s,background .2s}
.add:hover{border-color:#b8c3d9}
.add.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--soft)}
.add .t{flex:1}.add .t b{font-weight:600;display:block}.add .t span{display:block;color:var(--grey);font-size:12.5px;margin-top:2px}
.add .p{font-weight:700;white-space:nowrap;color:var(--navy)}
.warn{border:1px solid #f0d89a;background:#fff4dc;color:#8a5a00;border-radius:12px;padding:12px 14px;font-size:13.5px;margin:14px 0;line-height:1.4}
.resbox{border:1px solid var(--line);border-radius:16px;background:var(--soft);padding:22px;text-align:center;margin-bottom:16px;position:relative}
.resbox .big{font-size:42px;font-weight:800;color:var(--navy);letter-spacing:-.5px}
.resbox .cfg{color:var(--grey);font-size:14px;margin-top:6px;line-height:1.4}
.msibox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#eafaf2;border:1px solid #c5ecd8;border-radius:14px;padding:12px 16px;margin:14px 0}
.msibox .l{font-size:12px;font-weight:700;color:#13795a;line-height:1.3}.msibox .l span{font-weight:500}
.msibox .v{font-size:24px;font-weight:800;color:var(--green);white-space:nowrap}.msibox .v small{font-size:13px}
.ghost{width:100%;border:1px solid var(--navy);border-radius:999px;padding:14px;font-size:15px;font-weight:600;background:#fff;color:var(--navy);cursor:pointer;margin-top:10px;transition:background .2s,border-color .2s;text-align:center;display:block;text-decoration:none}
.ghost:hover{background:var(--soft)}
.ghost.wa-btn{border-color:#1a9c6b;color:#13795a;background:#eafaf2}
.ghost.wa-btn:hover{background:#dcf5e7}
.note{font-size:12px;color:var(--grey);margin-top:14px;text-align:center;line-height:1.4}
.sync-tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#1a9c6b;background:#eafaf2;border:1px solid #c5ecd8;border-radius:999px;padding:3px 9px;margin-top:8px;font-weight:600}
</style>
</head>

var POS_API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:3000'

var _posPriceCache = {};

/* Catálogo y reglas base ZEISS L5 2026 (idéntico al mostrador del POS para cálculo inmediato o fallback) */
var MONO_COST = {
  chrome: { term: 422 },
  '1.5':  { term: 747, proc: 1288 },
  '1.6':  { term: 829, proc: 1617 },
  '1.67': { term: 922, proc: 2019 },
  '1.74': { proc: 2857 }
};
var PROG_BASE_COST = {
  '1.5':  3662, // SmartLife Pure
  '1.6':  4532,
  '1.67': 5124,
  '1.74': 5924
};

var PRICING_TRAMOS = [
  { h: 600,   m: 2.45 },
  { h: 1500,  m: 2.20 },
  { h: 3000,  m: 1.85 },
  { h: 5000,  m: 1.62 },
  { h: 1e9,   m: 1.47 }
];

function multFor(c){
  c = c || 0;
  for (var i = 0; i < PRICING_TRAMOS.length; i++) {
    if (c < PRICING_TRAMOS[i].h) return PRICING_TRAMOS[i].m;
  }
  return 1.47;
}

window.multFor = multFor;

window.ZeissEngine = {
  cotizar: function(opt) {
    opt = opt || {};
    if (opt.opcion === 'chrome') {
      return { disponible: true, costoLista: 422, tipoFab: 'Terminado' };
    }
    var idx = opt.indice || '1.5';
    var isProg = opt.tipo === 'prog';
    var costo = isProg ? (PROG_BASE_COST[idx] || 3662) : (MONO_COST[idx] ? (MONO_COST[idx].term || MONO_COST[idx].proc) : 747);
    return { disponible: true, costoLista: costo, tipoFab: 'Terminado' };
  }
};

function charmPrice(n){
  return Math.round(n / 100) * 100 - 1;
}

function isTermStock(e, c, idx) {
  return (Math.abs(c) <= 2 && e >= -6 && e <= 4 && (idx === '1.5' || idx === '1.6'));
}

function t167Stock(e, c) {
  return (e >= 3 && e <= 6 && Math.abs(c) <= 2) || (e >= -10 && e <= -6.25 && c === 0);
}

/* Fallback local idéntico a mostrador */
function calcLocalZeiss(tipo, idx, trat, e, c, add) {
  e = typeof e === 'number' ? e : 0;
  c = typeof c === 'number' ? c : 0;
  var cost = 747;
  if (tipo === 'mono') {
    var d = MONO_COST[idx] || MONO_COST['1.5'];
    var stock = isTermStock(e, c, idx) || (idx === '1.67' && trat !== 'foto' && t167Stock(e, c));
    if (stock && d.term && !(trat === 'foto' && e < -4)) {
      cost = d.term;
    } else {
      cost = d.proc || d.term || 1288;
      if (trat === 'foto' && cost === 2755) cost = 2258;
    }
    if (trat === 'foto' && stock && idx === '1.6') cost = 1179;
    if (trat === 'foto' && idx === '1.5') cost = 1679;
  } else {
    var b = PROG_BASE_COST[idx] || PROG_BASE_COST['1.5'];
    var addOn = trat === 'foto' ? 309 : (trat === 'azul' ? 103 : 0);
    cost = b + addOn;
  }
  var iva = cost * 1.16;
  var m = multFor(cost);
  var raw = iva * m;
  return charmPrice(raw);
}

function money(n){ return '$' + Math.round(n).toLocaleString('en-US'); }

var RANGES = {
  '1.5':  [-7, 6, 4],
  '1.6':  [-10, 6, 6],
  '1.67': [-12, 8, 6],
  '1.74': [-20, 16, 6]
};
var ORDER = ['1.5', '1.6', '1.67', '1.74'];

function recommend(e, c){
  var pot = Math.max(Math.abs(e), Math.abs(e + c));
  var a = pot < 3 ? 1 : pot < 5 ? 2 : pot < 8 ? 3 : 4, m = 5;
  for (var i = 0; i < 4; i++) {
    var r = RANGES[ORDER[i]];
    if (e >= r[0] && e <= r[1] && Math.abs(c) <= r[2]) { m = i + 1; break; }
  }
  var rk = Math.max(a, m);
  return rk >= 5 ? null : ORDER[rk - 1];
}

  return v === '' ? 0 : parseFloat(v);

function potVal(){

    Math.abs(val('od-sph') + val('od-cyl')),
    Math.abs(val('oi-sph')),

function feasIdx(tratOverride){
  var trat = (tratOverride != null) ? tratOverride : st.trat;
  var e1 = val('od-sph'), e2 = val('oi-sph'), eMin = Math.min(e1, e2), eMax = Math.max(e1, e2);
  var cMax = Math.max(Math.abs(val('od-cyl')), Math.abs(val('oi-cyl')));
  var pot = potVal();
  var add = (st.need === 'prog') ? val('add') : 0;
  var combo = (trat === 'foto') ? COMBO_FOTO : COMBO_BLANCO;
  var out = [];
  ORDER.forEach(function(k){
    var r = RANGES[k];
    if (eMin >= r[0] && eMax <= r[1] && cMax <= r[2] && combo[k] != null && pot <= combo[k] && (st.need !== 'prog' || add <= ADDMAX[k])) {
      out.push(k);
    }
  });
  return out;
}

function recIdx(){
  var r1 = recommend(val('od-sph'), val('od-cyl')), r2 = recommend(val('oi-sph'), val('oi-cyl'));
  if (r1 === null || r2 === null) return null;
  return ORDER.indexOf(r1) >= ORDER.indexOf(r2) ? r1 : r2;
}

function chosenIdx(){
  var feas = feasIdx();
  if (!feas.length) return '1.5';
  var base = feas[0];
  var rec = recIdx();
  if (rec && feas.indexOf(rec) >= 0 && ORDER.indexOf(rec) > ORDER.indexOf(base)) return rec;

}

  var trat = tratOverride != null ? tratOverride : st.trat;
  var odE = val('od-sph'), odC = val('od-cyl'), odAx = val('od-axis'), odAd = need === 'prog' ? val('add') : 0;
  var oiE = st.same ? odE : val('oi-sph');
  var oiC = st.same ? odC : val('oi-cyl');
  var oiAx = st.same ? odAx : val('oi-axis');
  var oiAd = odAd;

  var cacheKey = [need, curIdx, trat, odE, odC, odAx, odAd, oiE, oiC, oiAx, oiAd].join('|');
  if (_posPriceCache[cacheKey]) {
    return callback(_posPriceCache[cacheKey]);
  }

  var effE = Math.max(Math.abs(odE), Math.abs(odE + odC)) >= Math.max(Math.abs(oiE), Math.abs(oiE + oiC)) ? odE : oiE;
  var effC = Math.max(Math.abs(odE), Math.abs(odE + odC)) >= Math.max(Math.abs(oiE), Math.abs(oiE + oiC)) ? odC : oiC;
  var localFallback = calcLocalZeiss(need, curIdx, trat, effE, effC, odAd);

  var payload = {
    tipo: need === 'prog' ? 'progresivo' : 'monofocal',
    esfera: effE,
    cilindro: effC,
    eje: odAx || 0,
    adicion: odAd || 0,
    indice: curIdx === '1.5' ? '1.50' : curIdx === '1.6' ? '1.60' : curIdx,
    tratamiento: trat === 'foto' ? 'fotocromatico' : (trat === 'azul' ? 'filtro_azul' : 'ninguno'),
    od: { esfera: odE, cilindro: odC, eje: odAx || 0, adicion: odAd },
    oi: { esfera: oiE, cilindro: oiC, eje: oiAx || 0, adicion: oiAd }
  };

  var done = false;
  var timer = setTimeout(function(){
    if (!done) {
      done = true;
      _posPriceCache[cacheKey] = localFallback;
      callback(localFallback);
    }
  }, 2200);

  fetch(POS_API_BASE + '/api/precio-mica', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    if (done) return;
    clearTimeout(timer);
    done = true;
    var finalP = (data && data.disponible && typeof data.precio === 'number') ? charmPrice(data.precio) : localFallback;
    _posPriceCache[cacheKey] = finalP;
    callback(finalP);
  })
  .catch(function(){
    if (done) return;
    clearTimeout(timer);
    done = true;
    _posPriceCache[cacheKey] = localFallback;
    callback(localFallback);
  });
}

function updateLeft(){
  var _im = document.getElementById("lensimg"), _orb = document.getElementById("lensorb");
  var _src = ZTRAT[st.trat] || ZTYPE[st.need] || "";
  if (_im) {
    if (_src) {
      _im.src = _src;
      _im.style.display = "";
      if (_orb) _orb.style.display = "none";
    } else {
      _im.style.display = "none";
      if (_orb) _orb.style.display = "";
    }
  }
  $('l-cat').textContent = typeLabel[st.need];

  if (st.ok && st.idx === '') {
    $('l-d').textContent = 'Tu mica ZEISS';
    $('l-v').textContent = '—';
    $('l-msi').textContent = 'Consúltanos';
    return;
  }

  var idx = st.ok ? st.idx : (st.step === 2 ? chosenIdx() : '1.5');
  if (!idx) idx = '1.5';

  var effE = Math.max(Math.abs(val('od-sph')), Math.abs(val('oi-sph')));
  var effC = Math.max(Math.abs(val('od-cyl')), Math.abs(val('oi-cyl')));
  var basePrice = calcLocalZeiss(st.need, idx, st.trat, effE, effC, val('add'));

  $('l-d').textContent = st.ok ? 'Tu mica ZEISS' : (st.step === 2 ? 'Estimado' : 'Desde');
  $('l-v').textContent = money(basePrice);
  $('l-msi').textContent = 'o ' + money(Math.round(basePrice / 3)) + '/mes a 3 MSI';

  if (st.step === 3 && st.ok) {
    queryPosPrice(idx, st.trat, function(livePrice){
      if ($('l-v')) $('l-v').textContent = money(livePrice);
      if ($('l-msi')) $('l-msi').textContent = 'o ' + money(Math.round(livePrice / 3)) + '/mes a 3 MSI';
      if ($('mainPrice')) $('mainPrice').textContent = money(livePrice);
      if ($('msiMonthly')) $('msiMonthly').textContent = money(Math.round(livePrice / 3));
    });
  }
}

function fillSel(id, vals, def){
  var s = $(id);
  if (!s) return;
  s.innerHTML = '';
  vals.forEach(function(v){
    var o = document.createElement('option');
    o.value = v[0];
    o.textContent = v[1];
    if (String(v[0]) === String(def)) o.selected = true;
    s.appendChild(o);
  });
}
function powerVals(){
  var a = [['', 'Elige']];
  for (var p = 16; p >= -20; p -= 0.25) {
    var v = p.toFixed(2);
    a.push([v, (p > 0 ? '+' : '') + v]);
  }
  return a;
}
function cylVals(){
  var a = [['0.00', '0.00']];
  for (var p = -0.25; p >= -6; p -= 0.25) a.push([p.toFixed(2), p.toFixed(2)]);
  return a;
}
function addVals(){
  var a = [['', 'Elige']];
  for (var p = 0.75; p <= 3.5; p += 0.25) a.push([p.toFixed(2), '+' + p.toFixed(2)]);
  return a;
}

function closeAllDD(){
  var o = document.querySelectorAll('.dd.open');
  for (var i = 0; i < o.length; i++) o[i].classList.remove('open');
}
document.addEventListener('click', closeAllDD);

function enhanceSelect(id){
  var sel = $(id);
  if (!sel || sel.dataset.enh) return;
  sel.dataset.enh = '1';
  sel.style.display = 'none';
  var dd = document.createElement('div'); dd.className = 'dd';
  var btn = document.createElement('div'); btn.className = 'dd-btn';
  var lbl = document.createElement('span'); var car = document.createElement('span');
  car.className = 'car'; car.textContent = '▾';
  btn.appendChild(lbl); btn.appendChild(car);
  var list = document.createElement('div'); list.className = 'dd-list';

  function sync(){
    var o = sel.options[sel.selectedIndex];
    lbl.textContent = o ? o.text : '';
  }

  Array.prototype.forEach.call(sel.options, function(o, i){
    var it = document.createElement('div');
    it.className = 'dd-opt' + (i === sel.selectedIndex ? ' sel' : '');
    it.textContent = o.text;
    it.addEventListener('click', function(e){
      e.stopPropagation();
      sel.selectedIndex = i;
      sync();
      var all = list.querySelectorAll('.dd-opt');
      for (var k = 0; k < all.length; k++) all[k].classList.remove('sel');
      it.classList.add('sel');
      sel.dispatchEvent(new Event('change'));
      dd.classList.remove('open');
    });
    list.appendChild(it);
  });

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var w = dd.classList.contains('open');
    closeAllDD();
    if (!w) {
      dd.classList.add('open');
      var r = btn.getBoundingClientRect();
      dd.classList.toggle('up', (window.innerHeight - r.bottom) < 260);
      if (sel.value === '') {
        var zero = null, opts = list.querySelectorAll('.dd-opt');
        for (var z = 0; z < opts.length; z++) {
          if (opts[z].textContent.trim() === '0.00') { zero = opts[z]; break; }
        }
        if (zero) zero.scrollIntoView({ block: 'center' });
      } else {
        var s = list.querySelector('.dd-opt.sel');
        if (s) s.scrollIntoView({ block: 'nearest' });
      }
    }
  });

  dd.appendChild(btn); dd.appendChild(list);
  sel.parentNode.insertBefore(dd, sel.nextSibling);
  sync();
  sel._dd = { sync: sync, el: dd };
}

function pick(n){ st.need = n; render(); }
function setTrat(t){ st.trat = (st.trat === t) ? 'none' : t; render(); }
function togThin(){ st.thin = !st.thin; render(); }
function toggleSame(){
  st.same = $('sameEye').checked;
  var sh = !st.same;
  $('oi-label').style.display = sh ? '' : 'none';
  ['oi-sph', 'oi-cyl'].forEach(function(id){
    var d = $(id)._dd;
    if (d && d.el) d.el.style.display = sh ? '' : 'none';
  });
  $('oi-axis').style.display = sh ? '' : 'none';
  $('oi-mirror').style.display = sh ? 'none' : '';
  if (st.same) copyOI();
  saveRx();
  updateLeft();
}
function copyOI(){
  ['sph', 'cyl'].forEach(function(f){
    var i = $('oi-' + f);
    i.value = $('od-' + f).value;
    if (i._dd) i._dd.sync();
  });
  $('oi-axis').value = $('od-axis').value;
}
function go(s){ st.step = s; render(); $('right').scrollTop = 0; }

function toResult(){
  var faltan = [], ejeFalta = false;
  if ($('od-sph').value === '') faltan.push(1);
  if (!st.same && $('oi-sph').value === '') faltan.push(1);
  if (st.need === 'prog' && $('add').value === '') faltan.push(1);

  var odc = $('od-cyl') ? parseFloat($('od-cyl').value || '0') : 0;
  if (odc !== 0 && $('od-axis').value === '') ejeFalta = true;
  if (!st.same) {
    var oic = $('oi-cyl') ? parseFloat($('oi-cyl').value || '0') : 0;
    if (oic !== 0 && $('oi-axis').value === '') ejeFalta = true;
  }

  if (faltan.length || ejeFalta) {
    var em = $('err');
    em.textContent = (ejeFalta && !faltan.length)
      ? 'Si tienes cilindro, falta el eje (1–180).'
      : ('Completa la esfera de ambos ojos' + (st.need === 'prog' ? ' y la ADD' : '') + ' para ver tu precio.');
    em.style.display = 'block';
    return;
  }
  if (st.same) copyOI();
  saveRx();
  st.thin = false;
  st.trat = 'none';
  st.ok = true;
  go(3);
}

function buildWhatsAppQuoteMessage(){
  var curIdx = st.idx || '1.5';
  var tratL = st.trat === 'azul' ? ' · filtro azul (BlueGuard)' : (st.trat === 'foto' ? ' · fotocromático (PhotoFusion X)' : '');
  var txt = '¡Hola Lensique! Me interesa cotizar estas micas ZEISS en línea:\n';
  txt += '• Tipo: Mica ZEISS ' + typeLabel[st.need] + '\n';
  txt += '• Índice: ' + idxLabel(curIdx) + tratL + '\n';
  txt += '• Antirreflejante: DuraVision Platinum (incluido)\n';
  txt += '• Graduación OD: Esf ' + val('od-sph') + ', Cil ' + val('od-cyl') + (val('od-cyl') ? ', Eje ' + ($('od-axis') ? $('od-axis').value : '') + '°' : '') + '\n';
  txt += '• Graduación OI: Esf ' + (st.same ? val('od-sph') : val('oi-sph')) + ', Cil ' + (st.same ? val('od-cyl') : val('oi-cyl')) + ((st.same ? val('od-cyl') : val('oi-cyl')) ? ', Eje ' + ($('oi-axis') ? $('oi-axis').value : '') + '°' : '') + '\n';
  if (st.need === 'prog') txt += '• Adición (ADD): +' + val('add') + '\n';
  txt += '• Cotización total: ' + ($('mainPrice') ? $('mainPrice').textContent : '$1,899') + ' por el par (IVA incluido)';
  return txt;
}

function comprarArmazon(){
  var quoteData = {
    tipo: st.need,
    tipoLabel: typeLabel[st.need],
    indice: st.idx,
    indiceLabel: idxLabel(st.idx),
    tratamiento: st.trat,
    antirreflejante: 'DuraVision Platinum',
    rx: {
      od: { esfera: val('od-sph'), cilindro: val('od-cyl'), eje: $('od-axis') ? $('od-axis').value : '' },
      oi: { esfera: st.same ? val('od-sph') : val('oi-sph'), cilindro: st.same ? val('od-cyl') : val('oi-cyl'), eje: $('oi-axis') ? $('oi-axis').value : '' },
      adicion: st.need === 'prog' ? val('add') : ''
    },
    precio: $('mainPrice') ? $('mainPrice').textContent : ''
  };
  try {
    localStorage.setItem('lensique_cotizacion_micas', JSON.stringify(quoteData));
  } catch(e){}

  var targetUrl = '/catalogo?tipo=' + encodeURIComponent(st.need) + '&cotizacion=1';
  if (window.top && window.top !== window) {
    window.top.location.href = targetUrl;
  } else {
    window.location.href = targetUrl;
  }
}

function agendarMontaje(){
  var msg = '¡Hola Lensique! Ya tengo mi armazón propio y quiero agendar cita para montaje de micas ZEISS:\n\n' + buildWhatsAppQuoteMessage();
  var waUrl = 'https://wa.me/523316929111?text=' + encodeURIComponent(msg);
  window.open(waUrl, '_blank');
}

function escribenosWhatsApp(){
  var msg = buildWhatsAppQuoteMessage();
  var waUrl = 'https://wa.me/523316929111?text=' + encodeURIComponent(msg);
  window.open(waUrl, '_blank');
}

function render(){
  var r = $('right'), h = '';
  if (st.step === 1) {
    st.ok = false;
    h += '<div class="step">Paso 1 de 3</div><h1>¿Qué micas necesitas?</h1><p class="sub">Elige el tipo de visión. Al final obtienes el precio exacto de tus micas ZEISS conectado a nuestro motor de óptica.</p>';
    h += opt('mono', 'Una distancia', 'Para ver de lejos, o solo para leer de cerca.');
    h += opt('prog', 'Progresivo', 'Lejos, intermedio y cerca en un lente, sin línea visible.');
    h += '<button class="cta" onclick="go(2)">Continuar</button>';
  } else if (st.step === 2) {
    h += '<button class="back" onclick="go(1)">‹ volver</button>';
    h += '<div class="step">Paso 2 de 3</div><h1>Tu graduación</h1><p class="sub">Ingresa tu receta médica para calcular el índice recomendado y precio exacto.</p>';
    h += '<div class="grid"><div></div><div class="lb">Esfera</div><div class="lb">Cilindro</div><div class="lb">Eje</div>'
      + '<div class="rl">OD</div><select id="od-sph"></select><select id="od-cyl"></select><input id="od-axis" type="number" min="1" max="180" placeholder="1–180">'
      + '<div class="rl" id="oi-label">OI</div><select id="oi-sph"></select><select id="oi-cyl"></select><input id="oi-axis" type="number" min="1" max="180" placeholder="1–180">'
      + '<div id="oi-mirror" style="display:none;grid-column:1/5;font-size:13px;color:var(--grey);padding:4px 0">OI · igual que el ojo derecho</div></div>';
    h += '<label class="same"><input type="checkbox" id="sameEye" onchange="toggleSame()"> Mi graduación es la misma en ambos ojos</label>';
    if (st.need === 'prog') {
      h += '<div style="margin-top:16px;max-width:200px"><div class="lb" style="text-align:left;margin-bottom:6px">ADD (adición)</div><select id="add"></select></div>';
    }
    h += '<div class="warn" id="err" style="display:none">Completa la esfera de ambos ojos' + (st.need === 'prog' ? ' y la ADD' : '') + ' para ver tu precio.</div>';
    h += '<button class="cta" onclick="toResult()">Ver precio de mis micas</button>';
  } else {
    h += '<button class="back" onclick="go(2)">‹ volver</button>';
    h += '<div class="step">Paso 3 de 3</div><h1>Tu cotización</h1><p class="sub">Precio por el par de micas (antirreflejante DuraVision Platinum incluido). Un optometrista valida tu graduación antes de fabricar.</p>';
    var feas = feasIdx();
    if (!feas.length) {
      if (st.trat === 'foto' && feasIdx('none').length) {
        h += '<div class="warn">Esta graduación no se fabrica en <b>fotocromático</b> (el índice 1.74 no está disponible en PhotoFusion X). Quítalo para ver tu precio.</div>';
        h += '<div class="add on" onclick="setTrat(\'foto\')"><div class="t"><b>Fotocromático</b><span>Tócalo para quitarlo.</span></div><span class="p">quitar</span></div>';
      } else {
        h += '<div class="warn">Esta graduación queda fuera del rango de fabricación estándar en línea. Escríbenos directamente y te asesoramos para cotizarla en mostrador.</div>';
      }
      h += '<button class="ghost wa-btn" onclick="escribenosWhatsApp()">Escríbenos por WhatsApp</button>';
      st.idx = '';
    } else {
      var base = feas[0];
      var rec = recIdx();
      if (rec && feas.indexOf(rec) < 0) rec = null;
      var worth = !!(rec && ORDER.indexOf(rec) > ORDER.indexOf(base) && potVal() >= 2);
      if (st.thin && !worth) st.thin = false;
      var curIdx = (worth && st.thin) ? rec : base;
      st.idx = curIdx;

      var effE = Math.max(Math.abs(val('od-sph')), Math.abs(val('oi-sph')));
      var effC = Math.max(Math.abs(val('od-cyl')), Math.abs(val('oi-cyl')));
      var resPrice = calcLocalZeiss(st.need, curIdx, st.trat, effE, effC, val('add'));
      var tratL = st.trat === 'azul' ? ' · filtro azul (BlueGuard)' : (st.trat === 'foto' ? ' · fotocromático (PhotoFusion X)' : '');

      h += '<div class="resbox">'
        + '<div class="big" id="mainPrice">' + money(resPrice) + '</div>'
        + '<div class="cfg">Mica ZEISS ' + typeLabel[st.need] + ' · índice ' + idxLabel(curIdx) + tratL + ' · Antirreflejante DuraVision Platinum incluido</div>'
        + '<span class="sync-tag">✓ Precio sincrono mostrador Lensique</span>'
        + '</div>';

      h += '<div class="lab">Ajusta tu mica (opcional)</div>';

      if (worth) {
        var dThin = calcLocalZeiss(st.need, rec, st.trat, effE, effC, val('add')) - calcLocalZeiss(st.need, base, st.trat, effE, effC, val('add'));
        h += '<div class="add' + (st.thin ? ' on' : '') + '" onclick="togThin()">'
          + '<div class="t"><b>Más delgada y ligera</b><span>Índice ' + idxLabel(rec) + ' · recomendada para tu potencia óptica.</span></div>'
          + '<span class="p">+' + money(dThin) + '</span></div>';
      }

      var dAz = calcLocalZeiss(st.need, curIdx, 'azul', effE, effC, val('add')) - calcLocalZeiss(st.need, curIdx, 'none', effE, effC, val('add'));
      h += '<div class="add' + (st.trat === 'azul' ? ' on' : '') + '" onclick="setTrat(\'azul\')">'
        + '<div class="t"><b>Filtro de luz azul (BlueGuard)</b><span>Protección para pantallas y dispositivos; menos fatiga visual.</span></div>'
        + '<span class="p">+' + money(dAz) + '</span></div>';

      if (feasIdx('foto').length) {
        var fi = feasIdx('foto')[0];
        var dFo = calcLocalZeiss(st.need, fi, 'foto', effE, effC, val('add')) - calcLocalZeiss(st.need, fi, 'none', effE, effC, val('add'));
        h += '<div class="add' + (st.trat === 'foto' ? ' on' : '') + '" onclick="setTrat(\'foto\')">'
          + '<div class="t"><b>Fotocromático (PhotoFusion X)</b><span>Se oscurece al sol y se aclara rápidamente en interiores.</span></div>'
          + '<span class="p">+' + money(dFo) + '</span></div>';
      }

      h += '<div class="msibox">'
        + '<span class="l">PÁGALO A MESES<br><span>3 meses sin intereses</span></span>'
        + '<span class="v" id="msiMonthly">' + money(Math.round(resPrice / 3)) + '<small>/mes</small></span>'
        + '</div>';

      h += '<button class="cta" onclick="comprarArmazon()">Comprar (elige tu armazón)</button>';
      h += '<button class="ghost" onclick="agendarMontaje()">Ya tengo mi armazón · agendar montaje</button>';
      h += '<button class="ghost wa-btn" onclick="escribenosWhatsApp()">Escríbenos por WhatsApp</button>';
      h += '<div class="note">Precio por par, IVA incluido. Una sola fuente de la verdad: sincronizado directamente con el cotizador mostrador del POS Lensique.</div>';
    }
  }
  r.innerHTML = h;

  if (st.step === 2) {
    fillSel('od-sph', powerVals(), '');
    fillSel('oi-sph', powerVals(), '');
    fillSel('od-cyl', cylVals(), '0.00');
    fillSel('oi-cyl', cylVals(), '0.00');
    if (st.need === 'prog') fillSel('add', addVals(), '');

    ['od-sph', 'oi-sph', 'od-cyl', 'oi-cyl'].forEach(enhanceSelect);
    if (st.need === 'prog') enhanceSelect('add');

    restoreRx();

    $('sameEye').checked = st.same;
    if (st.same) {
      $('oi-label').style.display = 'none';
      ['oi-sph', 'oi-cyl'].forEach(function(id){
        var d = $(id)._dd;
        if (d && d.el) d.el.style.display = 'none';
      });
      $('oi-axis').style.display = 'none';
      $('oi-mirror').style.display = '';
    }

    ['od-sph', 'oi-sph', 'od-cyl', 'oi-cyl', 'add'].forEach(function(id){
      if ($(id)) $(id).addEventListener('change', function(){
        if (st.same) copyOI();
        saveRx();
        updateLeft();
      });
    });
    $('od-axis').addEventListener('input', function(){
      if (st.same) copyOI();
      saveRx();
    });
    $('oi-axis').addEventListener('input', saveRx);
  }
  updateLeft();
}

function opt(n, t, d){
  var icons = {
    mono: '<circle cx="12" cy="12" r="8.2"/>',
    prog: '<circle cx="12" cy="12" r="8.2"/><line x1="4.5" y1="12" x2="19.5" y2="12"/>'
  };
  return '<div class="opt' + (st.need === n ? ' sel' : '') + '" onclick="pick(\'' + n + '\')">'
    + '<div class="ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#16223f" stroke-width="2">' + icons[n] + '</svg></div>'
    + '<div class="t"><b>' + t + '</b><span>' + d + '</span></div>'
    + '<div class="rd"></div></div>';
}

render();
</script>
