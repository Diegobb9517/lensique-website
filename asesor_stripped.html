  function zMono(k, idx) {

  /* ============ API PÚBLICA ============ */
  /*
    cotizar(input) — input:

    var pvp = Math.round(costoIva * mult / 50) * 50;
    var rx = buildRx(tipo, e, c, inp.eje, inp.add, inp.pd, inp.altura);

      etiqueta: label + (color ? ' · ' + color : ''),

      costoLista: p.cost, costoIva: Math.round(costoIva), pvp: pvp,
